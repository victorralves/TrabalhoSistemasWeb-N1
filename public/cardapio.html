<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardapio</title>
</head>

<body>
    <h1 style="text-align: center">Cardapio</h1>

    <p style="text-align: center">Nome do cliente:</p>
    <input type="text" id="nomeCliente" style="display: block; margin: 0 auto;">

    <h2 style="text-align: center">Produtos</h2>

    <table style="margin: 0 auto; text-align: center;">
        <thead>
            <tr>
                <th>Código do Produto |</th>
                <th>Nome do Produto |</th>
                <th>Preço do Produto |</th>
                <th>Quantidade em Estoque |</th>
            </tr>  
       

        <tbody id="tbody">
            <script>
                var produtosDoEstoque = {
                    listaProdutos: [],

                    getProdutos: function () {
                        var produtos = localStorage.getItem('produtos');
                        this.listaProdutos = produtos ? JSON.parse(produtos) : [];
                        return this.listaProdutos;
                    },
                    setProdutos: function (produtos) {
                        localStorage.setItem('produtos', JSON.stringify(produtos));
                    }
                }

                function carregarProdutos() {
                    var linkProdutos = 'http://localhost:3002/produtos';

                    fetch(linkProdutos)
                        .then(response => {
                            if (response.ok) return response.json();
                            throw new Error(`Falha na resposta do servidor (${response.status})`);
                        })
                        .then(produtos => {
                            produtosDoEstoque.setProdutos(produtos);
                            if (produtos == null || produtos.length === 0) {
                                console.log('Nenhum produto encontrado.');
                            }
                            exibirProdutos();
                        })
                        .catch(error =>
                            console.error('Erro ao carregar produtos:', error));
                }

                function exibirProdutos() {
                    var produtos = produtosDoEstoque.getProdutos();
                    var tbody = document.getElementById('tbody');
                    tbody.innerHTML = '';

                    produtos.forEach(produto => {
                        var tr = document.createElement('tr');
                        tr.innerHTML = `
                        <td>${produto.CodProduto}</td>
                        <td>${produto.NomeProduto}</td>
                        <td>${produto.PrecoProduto}</td>
                        <td>${produto.Estoque}</td>
                    `;
                        tbody.appendChild(tr);
                    });
                }

                carregarProdutos();
            </script>
        </tbody>
    </table>

    <div style="text-align: center">
        <br></br>
        <button type="submit">Enviar Pedido</button>
        <br></br>
        <a href="/" style="margin: 0 auto; align-items: center">Voltar para o inicio</a>
    </div>

    <p id="mensagem"></p>

    
</body>

</html>
